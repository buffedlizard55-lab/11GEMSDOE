name: Publish research dashboard and refresh public leaderboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the research package and run its tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q
      - name: Refresh public leaderboard snapshot
        run: |
          if ! python scripts/fetch_leaderboard.py --output docs/leaderboard.json; then
            echo "::warning::Public leaderboard refresh failed; publishing the last checked-in snapshot instead."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Guard against publishing an invalid submission file
        run: |
          # The download button on the site must never point at a file that would
          # be rejected with "Predicted values must be in range [0, 1]". When the
          # validated artefact is present, re-check it from disk; the template is
          # fetched by scripts/download_competition_data.sh and is not in the repo,
          # so this step runs only if both are available.
          if [ -f docs/downloads/gems-structural-area06-v1.tif ] && [ -f data/sample_submission.tif ]; then
            python scripts/validate_submission.py docs/downloads/gems-structural-area06-v1.tif
          else
            echo "::notice::Competition template not available in CI; skipping the on-disk submission re-check."
          fi
      - name: Build static site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
